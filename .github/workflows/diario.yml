name: Bot de vagas de IA

on:
  schedule:
    # O GitHub usa horário UTC. Brasília = UTC-3.
    - cron: "0 20 * * *"      # 17h de Brasília: coleta + resumo diário (Top 10)
    - cron: "0 */3 * * *"     # a cada 3 horas: coleta + alerta imediato de vagas com nota >= 80
  workflow_dispatch:           # botão "Run workflow" para rodar na mão
    inputs:
      resumo:
        description: "Enviar o resumo diário também?"
        type: boolean
        default: false

permissions:
  contents: write              # para salvar vagas.db e vagas.html no repositório

concurrency:
  group: bot-vagas
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Rodar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 20 * * *" ] || [ "${{ inputs.resumo }}" = "true" ]; then
            python main.py --resumo
          else
            python main.py
          fi

      - name: Salvar banco e relatório no repositório
        run: |
          git config user.name "bot-vagas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vagas.db vagas.html
          git diff --cached --quiet || git commit -m "Atualiza vagas $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
